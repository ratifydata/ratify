name: DCO Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  dco:
    name: DCO Sign-off Check
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if git show -s --format=%B "$sha" | grep -Eqi '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              echo "OK      $sha"
            else
              echo "::error::Commit $sha is missing a Signed-off-by line. See CONTRIBUTING.md"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Fix: git commit --amend -s --no-edit   (single commit)"
            echo "     git rebase --signoff origin/main  (multiple commits)"
            echo "Then: git push --force-with-lease"
            exit 1
          fi
